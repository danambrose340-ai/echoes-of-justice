name: Staging Deployment
on:
  push:
    branches: [develop, staging]
  workflow_dispatch:

jobs:
  deploy:
    name: Check, build and deploy to staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The Netlify CLI runs the build from netlify.toml (with the Next.js
      # runtime) and uploads the result. Without --prod this is a preview
      # deploy at the stable "staging" alias URL.
      - name: Build and deploy to Netlify (staging)
        run: npx --yes netlify-cli@27 deploy --build --alias staging --message "Staging ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
